<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f7f2">
<title>모동숲 가방 도우미</title>
<style>
:root{--bg:#f5f7f2;--card:#fff;--ink:#20251f;--muted:#737a70;--line:#e5e9e1;--accent:#2f6b4f;--accent2:#e8f3ec;--warn:#fff4df;--danger:#b4493d;--shadow:0 8px 28px rgba(34,52,39,.08)}
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink)}
button,input{font:inherit} button{touch-action:manipulation} .app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:110px}
.sticky{position:sticky;top:0;z-index:20;background:rgba(245,247,242,.96);backdrop-filter:blur(12px);padding:calc(12px + env(safe-area-inset-top)) 14px 12px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:10px} h1{font-size:20px;margin:0} .summary{text-align:right;font-size:13px;color:var(--muted)} .summary strong{display:block;color:var(--ink);font-size:17px}
.search{position:relative} #q{width:100%;height:52px;border:1px solid #d9dfd6;border-radius:16px;background:#fff;padding:0 46px 0 16px;font-size:17px;outline:none;box-shadow:0 3px 14px rgba(34,52,39,.05)} #q:focus{border-color:#8db59d;box-shadow:0 0 0 3px rgba(47,107,79,.09)} .clear{position:absolute;right:7px;top:7px;width:38px;height:38px;border:0;border-radius:12px;background:#eef1ec;color:#677066;font-size:18px}
.results{position:absolute;left:0;right:0;top:58px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;max-height:48vh;overflow-y:auto} .result{display:flex;align-items:center;gap:10px;padding:12px;border-bottom:1px solid var(--line)} .result:last-child{border-bottom:0} .result-main{flex:1;min-width:0} .result-name{font-weight:750} .result-meta{font-size:13px;color:var(--muted);margin-top:2px} .add{border:0;background:var(--accent);color:#fff;border-radius:12px;min-width:70px;height:42px;font-weight:750}
main{padding:16px 14px} .start{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--shadow);margin-top:12px} .start h2{margin:0 0 6px;font-size:21px} .start p{margin:0 0 16px;color:var(--muted);line-height:1.55} .start-row{display:flex;gap:8px} #capacity{min-width:0;flex:1;height:52px;border:1px solid #d9dfd6;border-radius:14px;padding:0 14px;font-size:18px} .primary{border:0;border-radius:14px;background:var(--accent);color:white;font-weight:800;padding:0 18px}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:8px 2px 12px} .section-title h2{font-size:16px;margin:0} .section-title span{font-size:13px;color:var(--muted)}
.sort-btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-size:13px;font-weight:800;color:var(--text);cursor:pointer}
.capacity-edit{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin-bottom:12px}.capacity-edit label{font-size:14px;font-weight:800;white-space:nowrap}.capacity-edit input{width:76px;height:40px;border:1px solid #d9dfd6;border-radius:11px;padding:0 10px;font-size:16px;text-align:center}.capacity-edit button{height:40px;border:0;border-radius:11px;background:var(--accent2);color:var(--accent);font-weight:800;padding:0 14px}.capacity-hint{margin-left:auto;font-size:12px;color:var(--muted);text-align:right}
.empty{text-align:center;color:var(--muted);padding:48px 20px;line-height:1.7}
.item{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:17px;padding:12px;margin-bottom:9px} .emoji{font-size:23px;width:32px;text-align:center} .info{flex:1;min-width:0} .name{font-weight:800;font-size:16px} .price{color:var(--muted);font-size:13px;margin-top:3px} .total{font-weight:750;font-size:14px;margin-top:3px} .qty{display:flex;align-items:center;gap:6px} .qty button{width:40px;height:40px;border:0;border-radius:12px;background:#eef2ec;font-size:21px;color:var(--ink)} .qty b{min-width:25px;text-align:center}
.reset{width:100%;height:48px;border:1px solid #e0c8c5;background:#fff;color:var(--danger);border-radius:15px;font-weight:750;margin-top:22px} .note{font-size:12px;color:var(--muted);text-align:center;line-height:1.5;margin:14px 10px}
.overlay{position:fixed;inset:0;background:rgba(20,25,21,.38);z-index:50;display:flex;align-items:flex-end;justify-content:center} .sheet{width:min(560px,100%);background:#fff;border-radius:24px 24px 0 0;padding:22px 18px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.14)} .sheet h3{margin:0 0 10px;font-size:22px} .sheet p{margin:0 0 16px;color:var(--muted);line-height:1.6} .swap{background:var(--warn);border-radius:16px;padding:14px;margin:12px 0 16px} .swap strong{font-size:18px} .gain{color:var(--accent);font-weight:800;margin-top:6px} .sheet-actions{display:grid;gap:8px} .sheet-actions button{height:52px;border-radius:14px;border:0;font-weight:800;font-size:16px} .confirm{background:var(--accent);color:#fff} .cancel{background:#eef1ec;color:var(--ink)} .hidden{display:none!important}
@media(min-width:700px){body{padding:24px} .app{min-height:calc(100vh - 48px);border:1px solid var(--line);border-radius:26px;overflow:clip;background:var(--bg)}}
</style>
</head>

    <button class="clear" id="clear" aria-label="검색 지우기">×</button>
    <div id="results" class="results hidden"></div>
  </div>
</header>
<main>

    <h2>빈 가방 칸부터 입력</h2>

    <div class="start-row"><input id="capacity" type="number" inputmode="numeric" min="1" max="40" placeholder="예: 10"><button id="startBtn" class="primary">채집 시작</button></div>
  </section>
  <section id="bag" class="hidden">
    <div class="section-title">
      <h2 id="sortTitle">💰 비싼 순서</h2>
      <button id="sortBtn" class="sort-btn" type="button">⇅ 싼 순서로</button>
    </div>
    <div class="capacity-edit">
      <label for="capacityEdit">가방 칸</label>
      <input id="capacityEdit" type="number" inputmode="numeric" min="1" max="40">
      <button id="capacityBtn">변경</button>
      <div id="capacityHint" class="capacity-hint"></div>
    </div>
    <div id="list"></div>
    <div id="empty" class="empty">아직 가방이 비어 있어.<br>위 검색창에 초성을 입력해봐 👆</div>
    <button id="reset" class="reset">가방 초기화</button>
    <div class="note">기본 너굴 상점 판매가 기준 · 현재 기록은 이 브라우저의 localStorage에 저장됩니다.</div>
  </section>
</main>
</div>
<div id="overlay" class="overlay hidden"><div class="sheet"><h3 id="modalTitle"></h3><p id="modalText"></p><div id="swap" class="swap hidden"></div><div class="sheet-actions"><button id="confirm" class="confirm"></button><button id="cancel" class="cancel">취소</button></div></div></div>

const KEY='sseweng_acnh_bag_v1';
let state={capacity:0,bag:{},sortOrder:'desc'}; let pending=null;
const $=s=>document.querySelector(s); const fmt=n=>n.toLocaleString('ko-KR')+'벨';
function choseong(str){const CH='ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';return [...str].map(c=>{const code=c.charCodeAt(0)-44032;return code>=0&&code<11172?CH[Math.floor(code/588)]:c;}).join('');}
function searchable(i,q){q=q.trim().replace(/\s+/g,'').toLowerCase(); if(!q)return false; const names=[i.name,...(i.aliases||[])]; return names.some(n=>n.toLowerCase().replace(/\s+/g,'').includes(q)||choseong(n).includes(q));}
function save(){localStorage.setItem(KEY,JSON.stringify(state));}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&x.capacity>0){state=x;if(!state.sortOrder)state.sortOrder='desc';if(state.bag&&state.bag['쏨뱅이']){state.bag['쏠배감펭']=(state.bag['쏠배감펭']||0)+state.bag['쏨뱅이'];delete state.bag['쏨뱅이'];save();}}}catch(e){}}
function count(){return Object.values(state.bag).reduce((a,b)=>a+b,0)}
function value(){return Object.entries(state.bag).reduce((s,[name,q])=>{const i=DATA.find(x=>x.name===name);return s+(i?i.price*q:0)},0)}
function render(){const started=state.capacity>0; $('#start').classList.toggle('hidden',started);$('#bag').classList.toggle('hidden',!started);$('#q').disabled=!started;$('#slots').textContent=started?`${count()} / ${state.capacity}칸`:'시작 전';$('#worth').textContent=fmt(value());if(!started)return;$('#capacityEdit').value=state.capacity;$('#capacityEdit').min=Math.max(1,count());$('#capacityHint').textContent=count()>0?`최소 ${count()}칸`:'1~40칸';$('#sortTitle').textContent=state.sortOrder==='desc'?'💰 비싼 순서':'💰 싼 순서';$('#sortBtn').textContent=state.sortOrder==='desc'?'⇅ 싼 순서로':'⇅ 비싼 순서로'; const rows=Object.entries(state.bag).filter(([,q])=>q>0).map(([name,q])=>({...DATA.find(x=>x.name===name),q})).sort((a,b)=>(state.sortOrder==='desc'?b.price-a.price:a.price-b.price)||a.name.localeCompare(b.name,'ko')); $('#empty').classList.toggle('hidden',rows.length>0);$('#list').innerHTML=rows.map(i=>`<div class="item"><div class="emoji">${i.icon}</div><div class="info"><div class="name">${i.name}</div><div class="price">${i.category} · ${fmt(i.price)} × ${i.q}</div><div class="total">${fmt(i.price*i.q)}</div></div><div class="qty"><button data-minus="${i.name}" aria-label="${i.name} 한 개 빼기">−</button><b>${i.q}</b><button data-plus="${i.name}" aria-label="${i.name} 한 개 추가">+</button></div></div>`).join('');}
function lowest(){return Object.entries(state.bag).filter(([,q])=>q>0).map(([name,q])=>({...DATA.find(x=>x.name===name),q})).sort((a,b)=>a.price-b.price||a.name.localeCompare(b.name,'ko'))[0]||null}
function commitAdd(item){state.bag[item.name]=(state.bag[item.name]||0)+1;save();render();}
function askAdd(item){if(count()<state.capacity){commitAdd(item);return} const low=lowest(); pending={type:item.price>low.price?'swap':'reject',item,low}; $('#overlay').classList.remove('hidden'); if(pending.type==='swap'){$('#modalTitle').textContent='🔄 교체 추천';$('#modalText').textContent=`가방이 꽉 찼어. ${low.name} 1개를 버리고 ${item.name}을 보관하면 돼.`;$('#swap').classList.remove('hidden');$('#swap').innerHTML=`<strong>${low.icon} ${low.name} ${fmt(low.price)} → ${item.icon} ${item.name} ${fmt(item.price)}</strong><div class="gain">+${fmt(item.price-low.price)} 이득</div>`;$('#confirm').textContent=`${low.name} 버렸어요 ✓`;}else{$('#modalTitle').textContent='👋 놓아주세요'; const equal=item.price===low.price;$('#modalText').textContent=equal?'현재 최저가와 가격이 같아서 굳이 교체할 필요가 없어.':'지금 가방에 있는 최저가 아이템보다 저렴해.';$('#swap').classList.remove('hidden');$('#swap').innerHTML=`<strong>${item.icon} ${item.name} ${fmt(item.price)}</strong><div>현재 최저가: ${low.name} ${fmt(low.price)}</div>`;$('#confirm').textContent='놓아줬어요 ✓';}}
function closeModal(){pending=null;$('#overlay').classList.add('hidden')}
function search(){const q=$('#q').value; if(!q.trim()){$('#results').classList.add('hidden');return} const hits=DATA.filter(i=>searchable(i,q)).sort((a,b)=>a.price-b.price||a.name.localeCompare(b.name,'ko')).slice(0,12);$('#results').innerHTML=hits.length?hits.map(i=>`<div class="result"><div class="emoji">${i.icon}</div><div class="result-main"><div class="result-name">${i.name}</div><div class="result-meta">${i.category} · ${fmt(i.price)}</div></div><button class="add" data-add="${i.name}">+1 추가</button></div>`).join(''):'<div class="result"><div class="result-main"><div class="result-name">검색 결과 없음</div><div class="result-meta">게임 내 이름이나 초성을 확인해줘.</div></div></div>';$('#results').classList.remove('hidden');}
$('#startBtn').onclick=()=>{const n=parseInt($('#capacity').value,10);if(!n||n<1||n>40){alert('빈 가방 칸을 1~40 사이로 입력해줘.');return}state={capacity:n,bag:{}};save();render();setTimeout(()=>$('#q').focus(),100)};
$('#q').addEventListener('input',search);$('#clear').onclick=()=>{$('#q').value='';search();$('#q').focus()};
$('#results').addEventListener('click',e=>{const b=e.target.closest('[data-add]');if(!b)return;const item=DATA.find(x=>x.name===b.dataset.add);$('#q').value='';$('#results').classList.add('hidden');askAdd(item);});
$('#list').addEventListener('click',e=>{const m=e.target.closest('[data-minus]'),p=e.target.closest('[data-plus]');if(m){const n=m.dataset.minus;state.bag[n]--;if(state.bag[n]<=0)delete state.bag[n];save();render()}if(p){const item=DATA.find(x=>x.name===p.dataset.plus);askAdd(item)}});
$('#confirm').onclick=()=>{if(!pending)return;if(pending.type==='swap'){state.bag[pending.low.name]--;if(state.bag[pending.low.name]<=0)delete state.bag[pending.low.name];state.bag[pending.item.name]=(state.bag[pending.item.name]||0)+1;save();render()}closeModal();setTimeout(()=>$('#q').focus(),100)};$('#cancel').onclick=closeModal;$('#overlay').addEventListener('click',e=>{if(e.target===$('#overlay'))closeModal()});
$('#sortBtn').onclick=()=>{state.sortOrder=state.sortOrder==='desc'?'asc':'desc';save();render();};
$('#capacityBtn').onclick=()=>{const used=count();let n=parseInt($('#capacityEdit').value,10);if(!n||n<1||n>40){alert('가방 칸은 1~40 사이로 입력해줘.');$('#capacityEdit').value=state.capacity;return}if(n<used){alert(`지금 ${used}칸을 사용 중이라 ${used}칸보다 작게 줄일 수 없어.`);n=used;$('#capacityEdit').value=used;return}state.capacity=n;save();render();};
$('#capacityEdit').addEventListener('keydown',e=>{if(e.key==='Enter')$('#capacityBtn').click()});
$('#reset').onclick=()=>{if(confirm('현재 가방 기록을 전부 초기화할까?')){localStorage.removeItem(KEY);state={capacity:0,bag:{}};$('#capacity').value='';$('#q').value='';$('#results').classList.add('hidden');render()}};
load();render();
</script>
</body></html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>혼코노 DB 연결 테스트</title>
<style>
*{box-sizing:border-box} body{margin:0;min-height:100vh;background:#f6f7fb;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:#171923;padding:20px}
.wrap{width:min(100%,520px);margin:40px auto}.card{background:#fff;border:1px solid #e8eaf0;border-radius:24px;padding:26px;box-shadow:0 12px 40px #14182814}
h1{font-size:25px;margin:0 0 8px}p{color:#687083;line-height:1.5}label{display:block;font-size:13px;font-weight:800;margin:14px 0 7px}
input{width:100%;padding:14px;border:1px solid #d9dde7;border-radius:13px;font-size:16px}
button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:13px;background:#171923;color:white;font-weight:800;font-size:16px}
#app{display:none}.song{border:1px solid #e8eaf0;border-radius:16px;padding:16px;margin-top:12px}.song b{font-size:18px}.meta{margin-top:5px;color:#687083}.memo{margin-top:10px}.status{display:inline-block;margin-top:9px;padding:5px 9px;border-radius:999px;background:#f1f2f6;font-size:13px;font-weight:800}
#msg{margin-top:13px;color:#a52a2a}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.top button{width:auto;margin:0;padding:9px 12px;background:#eef0f5;color:#242936;font-size:13px}
</style>
</head>
<body><div class="wrap"><div class="card">
<section id="login"><h1>🎤 혼코노 도전곡 노트</h1><p>로그인하고 Supabase의 songs 장부를 불러와보자.</p>
<form id="form"><label>이메일</label><input id="email" type="email" autocomplete="username" required>
<label>비밀번호</label><input id="password" type="password" autocomplete="current-password" required>
<button id="btn">로그인</button></form><div id="msg"></div></section>

<section id="app"><div class="top"><div><h1>🎵 내 도전곡</h1><p id="who" style="margin:4px 0 0"></p></div><button id="logout">로그아웃</button></div>
<div id="songs"><p>불러오는 중...</p></div></section>
</div></div>
<script>
const URL="https://nirggbfyavvbeaikjhvn.supabase.co";
const KEY="sb_publishable_D-tRymcuBoMq3i63nAyRIg_WNkQgLD_";
const $=s=>document.querySelector(s);
const loadSession=()=>{try{return JSON.parse(localStorage.getItem("honkono_session")||"null")}catch{return null}};
const saveSession=s=>localStorage.setItem("honkono_session",JSON.stringify(s));
const clearSession=()=>localStorage.removeItem("honkono_session");

function showLogin(){ $("#app").style.display="none";$("#login").style.display="block" }
async function showApp(s){ $("#login").style.display="none";$("#app").style.display="block";$("#who").textContent=s.user?.email||""; await loadSongs(s) }

async function loadSongs(s){
 const box=$("#songs"); box.innerHTML="<p>Supabase에서 불러오는 중...</p>";
 try{
  const r=await fetch(URL+"/rest/v1/songs?select=id,created_at,title,artist,status,memo&order=created_at.desc",{
   headers:{apikey:KEY,Authorization:"Bearer "+s.access_token}
  });
  if(!r.ok){const t=await r.text();throw Error("DB 불러오기 실패 ("+r.status+"): "+t)}
  const rows=await r.json();
  if(!rows.length){box.innerHTML="<p>저장된 곡이 아직 없습니다.</p>";return}
  const names={good:"🟢 자신 있음",maybe:"🟡 애매함",ban:"🔴 금지곡"};
  box.innerHTML="";
  rows.forEach(x=>{
   const d=document.createElement("div");d.className="song";
   const b=document.createElement("b");b.textContent=x.title||"(제목 없음)";
   const m=document.createElement("div");m.className="meta";m.textContent=x.artist||"(가수 없음)";
   const st=document.createElement("div");st.className="status";st.textContent=names[x.status]||x.status||"상태 없음";
   const memo=document.createElement("div");memo.className="memo";memo.textContent=x.memo||"";
   d.append(b,m,st); if(x.memo)d.append(memo); box.append(d);
  });
 }catch(e){box.innerHTML="";const p=document.createElement("p");p.style.color="#a52a2a";p.textContent=e.message;box.append(p)}
}

$("#form").onsubmit=async e=>{
 e.preventDefault();$("#msg").textContent="";$("#btn").disabled=true;$("#btn").textContent="로그인 중...";
 try{
  const r=await fetch(URL+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},
   body:JSON.stringify({email:$("#email").value.trim(),password:$("#password").value})});
  const d=await r.json();if(!r.ok)throw Error(d.msg||d.message||"로그인 실패");
  saveSession(d);$("#form").reset();await showApp(d);
 }catch(e){$("#msg").textContent=e.message}finally{$("#btn").disabled=false;$("#btn").textContent="로그인"}
};
$("#logout").onclick=()=>{clearSession();showLogin()};

(async()=>{
 let s=loadSession();
 if(!s)return showLogin();
 if((s.expires_at||0)*1000<=Date.now()+30000 && s.refresh_token){
  try{
   const r=await fetch(URL+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:s.refresh_token})});
   if(r.ok){s=await r.json();saveSession(s)}else{s=null}
  }catch{s=null}
 }
 if(s)await showApp(s);else{clearSession();showLogin()}
})();
</script></body></html>

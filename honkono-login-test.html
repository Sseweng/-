<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>혼코노 로그인 테스트</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f7fb;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:#171923;padding:20px}.card{width:min(100%,420px);background:#fff;border:1px solid #e8eaf0;border-radius:24px;padding:28px;box-shadow:0 12px 40px #14182814}h1{font-size:26px;margin:0 0 8px}p{color:#687083;line-height:1.55}label{display:block;font-size:13px;font-weight:800;margin:15px 0 7px}input{width:100%;padding:14px;border:1px solid #d9dde7;border-radius:13px;font-size:16px}button{width:100%;margin-top:20px;padding:14px;border:0;border-radius:13px;background:#171923;color:#fff;font-size:16px;font-weight:800;cursor:pointer}#app{display:none;text-align:center}#msg{margin-top:15px;color:#a52a2a}#logout{background:#eef0f5;color:#242936}</style></head>
<body><main class="card"><section id="login"><h1>🎤 혼코노 도전곡 노트</h1><p>Supabase 개인 계정 로그인 테스트</p><form id="form"><label>이메일</label><input id="email" type="email" autocomplete="username" required><label>비밀번호</label><input id="password" type="password" autocomplete="current-password" required><button id="btn">로그인</button></form><div id="msg"></div></section><section id="app"><h1>✅ 로그인 성공!</h1><p id="who"></p><p>다음 단계에서 여기에 혼코노 노트를 붙이면 됩니다.</p><button id="logout">로그아웃</button></section></main>
<script>
const URL="https://nirggbfyavvbeaikjhvn.supabase.co";
const KEY="sb_publishable_D-tRymcuBoMq3i63nAyRIg_WNkQgLD_";
const login=document.querySelector("#login"),app=document.querySelector("#app"),msg=document.querySelector("#msg"),form=document.querySelector("#form"),btn=document.querySelector("#btn");
const showApp=e=>{login.style.display="none";app.style.display="block";document.querySelector("#who").textContent=e?e+" 계정으로 인증되었습니다.":"인증되었습니다."};
const showLogin=()=>{app.style.display="none";login.style.display="block"};
const load=()=>{try{return JSON.parse(localStorage.getItem("honkono_session")||"null")}catch{return null}};
const save=x=>localStorage.setItem("honkono_session",JSON.stringify(x));
async function refresh(s){const r=await fetch(URL+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:s.refresh_token})});return r.ok?await r.json():null}
async function restore(){let s=load();if(!s)return showLogin();if((s.expires_at||0)*1000>Date.now()+30000)return showApp(s.user?.email);try{s=await refresh(s);if(s){save(s);return showApp(s.user?.email)}}catch{}localStorage.removeItem("honkono_session");showLogin()}
form.onsubmit=async e=>{e.preventDefault();msg.textContent="";btn.disabled=true;btn.textContent="로그인 중...";try{const r=await fetch(URL+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify({email:email.value.trim(),password:password.value})});const d=await r.json();if(!r.ok)throw Error(d.msg||d.message||"로그인 실패");save(d);form.reset();showApp(d.user?.email)}catch(e){msg.textContent=e.message}finally{btn.disabled=false;btn.textContent="로그인"}};
document.querySelector("#logout").onclick=()=>{localStorage.removeItem("honkono_session");showLogin()};restore();
</script></body></html>

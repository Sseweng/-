<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>혼코노 노래 검색 테스트</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;background:#f6f7f9;color:#17191c}.wrap{width:min(680px,calc(100% - 28px));margin:auto;padding:38px 0 70px}.badge{background:#e9f0ff;color:#315fbd;font-size:12px;font-weight:800;padding:7px 10px;border-radius:999px}h1{font-size:30px;margin:16px 0 8px}.sub,.status{color:#69707a}.sub{line-height:1.6}.search{display:flex;gap:8px;position:sticky;top:0;background:#f6f7f9;padding:14px 0}input{min-width:0;flex:1;height:50px;border:1px solid #dfe3e8;border-radius:15px;padding:0 16px;font-size:16px}button{height:50px;border:0;border-radius:15px;padding:0 18px;font-weight:800;background:#315fbd;color:white}.results{display:grid;gap:10px}.song{display:flex;align-items:center;gap:12px;background:white;border:1px solid #e1e4e8;border-radius:17px;padding:12px}.song img{width:58px;height:58px;border-radius:12px}.info{min-width:0}.title{font-weight:850}.artist,.album{font-size:13px;color:#69707a;margin-top:3px}.empty{background:white;border:1px dashed #d8dde4;border-radius:18px;padding:34px 20px;text-align:center;color:#7b828c;line-height:1.7}.note{margin-top:28px;padding:15px;border-radius:15px;background:#fff7df;color:#735b16;font-size:13px;line-height:1.6}</style></head>
<body><main class="wrap"><span class="badge">🎤 API TEST</span><h1>혼코노 노래 검색</h1><p class="sub">일단 검색 품질만 시험하는 페이지야. 마음에 들면 다음에 내 노래 목록을 붙이자 ㅋㅋ</p><div class="search"><input id="q" placeholder="노래 제목 또는 가수 검색"><button id="go">검색</button></div><div id="status" class="status">예: 사건의 지평선, 좋은 날, DAY6 예뻤어</div><div id="results" class="results"><div class="empty">노래를 검색해봐 🎵</div></div><div class="note">이번 버전은 저장 기능 없음. 한국 스토어 노래 검색 결과가 얼마나 잘 나오는지만 확인하는 시험판이야.</div></main>
<script>
const q=document.querySelector('#q'),go=document.querySelector('#go'),results=document.querySelector('#results'),statusEl=document.querySelector('#status');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function search(){const term=q.value.trim();if(!term)return;go.disabled=true;go.textContent='검색 중';statusEl.textContent='검색 중…';results.innerHTML='<div class="empty">검색하고 있어 🎧</div>';
try{const url='https://itunes.apple.com/search?term='+encodeURIComponent(term)+'&country=KR&media=music&entity=song&limit=20';const r=await fetch(url);if(!r.ok)throw new Error();const d=await r.json();statusEl.textContent=`"${term}" 검색 결과 ${d.resultCount}개`;results.innerHTML=d.results.length?d.results.map(x=>`<article class="song"><img src="${esc(x.artworkUrl100||'')}" alt=""><div class="info"><div class="title">${esc(x.trackName)}</div><div class="artist">${esc(x.artistName)}</div><div class="album">${esc(x.collectionName||'')}</div></div></article>`).join(''):'<div class="empty">검색 결과가 없어. 가수 이름을 같이 넣어봐.</div>'}catch(e){statusEl.textContent='검색 실패';results.innerHTML='<div class="empty">API 호출에 실패했어 😭<br>이 화면이 나오면 알려줘.</div>'}finally{go.disabled=false;go.textContent='검색'}}
go.onclick=search;q.addEventListener('keydown',e=>{if(e.key==='Enter')search()});
</script></body></html>

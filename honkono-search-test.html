<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>혼코노 노래 검색 테스트 v2</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;background:#f6f7f9;color:#17191c}
.wrap{width:min(680px,calc(100% - 28px));margin:auto;padding:38px 0 70px}
.badge{display:inline-block;background:#e9f0ff;color:#315fbd;font-size:12px;font-weight:800;padding:7px 10px;border-radius:999px}
h1{font-size:30px;margin:14px 0 8px;letter-spacing:-.04em}.sub{color:#69707a;line-height:1.6;margin:0 0 20px}
.search{display:flex;gap:8px;position:sticky;top:0;background:rgba(246,247,249,.95);padding:12px 0;z-index:3}
input{min-width:0;flex:1;height:50px;border:1px solid #dfe3e8;border-radius:15px;padding:0 16px;font-size:16px;background:#fff}
button{height:50px;border:0;border-radius:15px;padding:0 18px;font-size:15px;font-weight:800;background:#315fbd;color:#fff}
button:disabled{opacity:.55}.status{font-size:13px;color:#69707a;margin:10px 2px 14px}.results{display:grid;gap:10px}
.song{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid #e1e4e8;border-radius:17px;padding:12px}
.song img{width:58px;height:58px;border-radius:12px;object-fit:cover;background:#eef0f2}.info{min-width:0;flex:1}
.title{font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.artist,.album{font-size:13px;color:#69707a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.empty{background:#fff;border:1px dashed #d8dde4;border-radius:18px;padding:34px 20px;text-align:center;color:#7b828c;line-height:1.7}
.debug{margin-top:26px;padding:14px;border-radius:15px;background:#fff7df;color:#735b16;font-size:12px;line-height:1.6;word-break:break-all}
</style>
</head>
<body>
<main class="wrap">
<span class="badge">🎤 API TEST v2</span>
<h1>혼코노 노래 검색</h1>
<p class="sub">이번 버전은 브라우저 fetch 대신 Apple 검색 API의 JSONP callback 방식으로 테스트해.</p>
<div class="search">
<input id="q" placeholder="노래 제목 또는 가수 검색" autocomplete="off">
<button id="go">검색</button>
</div>
<div id="status" class="status">예: 사건의 지평선 / 윤하 / DAY6 예뻤어</div>
<div id="results" class="results"><div class="empty">노래를 검색해봐 🎵</div></div>
<div id="debug" class="debug">상태: 검색 대기 중</div>
</main>

<script>
const q=document.querySelector('#q'),go=document.querySelector('#go'),results=document.querySelector('#results'),statusEl=document.querySelector('#status'),debug=document.querySelector('#debug');
let activeScript=null,timer=null,seq=0;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function finish(){
  go.disabled=false; go.textContent='검색';
  if(timer){clearTimeout(timer);timer=null}
  if(activeScript){activeScript.remove();activeScript=null}
}
function showData(data){
  const arr=(data&&Array.isArray(data.results))?data.results:[];
  statusEl.textContent=`검색 결과 ${arr.length}개`;
  debug.textContent=`상태: 성공 · Apple에서 ${arr.length}개 받음`;
  results.innerHTML=arr.length?arr.map(x=>`<article class="song">
    <img src="${esc(x.artworkUrl100||'')}" alt="">
    <div class="info">
      <div class="title">${esc(x.trackName)}</div>
      <div class="artist">${esc(x.artistName)}</div>
      <div class="album">${esc(x.collectionName||'')}</div>
    </div>
  </article>`).join(''):'<div class="empty">검색 결과가 없어.<br>노래 제목 + 가수로 다시 검색해봐.</div>';
  finish();
}
function search(){
  const term=q.value.trim(); if(!term)return;
  finish(); seq++;
  const cb='itunesCallback_'+seq;
  go.disabled=true;go.textContent='검색 중';
  statusEl.textContent=`"${term}" 검색 중…`;
  results.innerHTML='<div class="empty">Apple에 물어보는 중 🎧</div>';
  debug.textContent='상태: JSONP 요청 보내는 중';

  window[cb]=function(data){
    try{showData(data)}finally{delete window[cb]}
  };

  const params=new URLSearchParams({
    term:term,country:'KR',media:'music',entity:'song',limit:'25',callback:cb
  });
  activeScript=document.createElement('script');
  activeScript.src='https://itunes.apple.com/search?'+params.toString();
  activeScript.async=true;
  activeScript.onerror=function(){
    statusEl.textContent='검색 실패';
    results.innerHTML='<div class="empty">Apple API 스크립트를 불러오지 못했어 😭</div>';
    debug.textContent='상태: script 로딩 실패 · 이 문구를 그대로 알려줘';
    delete window[cb]; finish();
  };
  document.body.appendChild(activeScript);

  timer=setTimeout(function(){
    statusEl.textContent='검색 시간 초과';
    results.innerHTML='<div class="empty">10초 동안 응답이 없었어 😭</div>';
    debug.textContent='상태: callback 응답 없음(10초 초과) · 이 문구를 그대로 알려줘';
    delete window[cb]; finish();
  },10000);
}
go.onclick=search;
q.addEventListener('keydown',e=>{if(e.key==='Enter')search()});
</script>
</body>
</html>

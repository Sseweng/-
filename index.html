<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>쓰웽이네 | My Tools</title>
  <style>
    * { box-sizing: border-box; }
    :root { --text:#172033; --muted:#68758a; --blue:#3974e8; --line:#e4e9f1; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",Arial,sans-serif; color:var(--text); background:linear-gradient(180deg,#f8fbff 0%,#f5f7fa 100%); }
    .wrap { width:min(1040px,calc(100% - 36px)); margin:0 auto; padding:58px 0 42px; }
    .hero { position:relative; display:grid; grid-template-columns:minmax(0,1fr) minmax(360px,.95fr); align-items:center; gap:28px; min-height:360px; margin-bottom:34px; padding:24px 12px 16px; }
    .hero::before { content:""; position:absolute; right:2%; top:8%; width:390px; height:290px; border-radius:48% 52% 55% 45%; background:radial-gradient(circle at 50% 50%,rgba(104,166,255,.18),rgba(104,166,255,0) 70%); z-index:-1; }
    .eyebrow { margin:0 0 14px; color:#72819a; font-size:14px; font-weight:800; letter-spacing:.14em; }
    h1 { margin:0; max-width:560px; font-size:clamp(42px,6vw,68px); line-height:1.08; letter-spacing:-.055em; }
    h1 .accent { color:var(--blue); }
    .intro { max-width:570px; margin:20px 0 0; color:var(--muted); font-size:17px; line-height:1.75; }
    .hero-art { display:flex; align-items:center; justify-content:center; min-width:0; }
    .hero-art img { display:block; width:min(100%,500px); height:auto; filter:drop-shadow(0 18px 22px rgba(34,62,104,.10)); }
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:20px; }
    .card { position:relative; overflow:hidden; display:block; min-height:245px; padding:30px; border:1px solid var(--line); border-radius:26px; background:rgba(255,255,255,.88); color:inherit; text-decoration:none; box-shadow:0 12px 30px rgba(32,53,84,.055); transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease; }
    .card:hover { transform:translateY(-4px); border-color:#d2dbe8; box-shadow:0 18px 36px rgba(32,53,84,.09); }
    .card::after { content:""; position:absolute; width:180px; height:180px; right:-65px; bottom:-85px; border-radius:50%; background:rgba(69,122,232,.055); }
    .card.game::after { background:rgba(72,174,126,.075); }
    .icon { display:grid; place-items:center; width:58px; height:58px; margin-bottom:24px; border-radius:18px; background:#f2f5fa; font-size:29px; }
    .game .icon { background:#eef8f1; }
    .card h2 { margin:0 0 10px; font-size:23px; letter-spacing:-.035em; }
    .card p { margin:0; max-width:410px; color:var(--muted); line-height:1.65; font-size:14px; }
    .open { position:absolute; left:30px; bottom:28px; z-index:1; display:inline-block; font-size:14px; font-weight:800; color:var(--blue); }
    .game .open { color:#29976c; }
    footer { display:flex; align-items:center; justify-content:center; gap:9px; margin-top:48px; padding-top:26px; border-top:1px solid #e3e8ef; color:#929cac; font-size:12px; }
    footer span { font-size:15px; }
    @media (max-width:760px) {
      .wrap { padding-top:30px; }
      .hero { grid-template-columns:1fr; gap:8px; min-height:0; padding:12px 4px 4px; text-align:center; }
      .hero-copy { order:1; }
      .hero-art { order:2; margin-top:4px; }
      .hero-art img { width:min(88vw,430px); }
      h1 { margin:0 auto; font-size:clamp(38px,12vw,54px); }
      .intro { margin:16px auto 0; font-size:15px; }
      .grid { grid-template-columns:1fr; }
    }
    @media (max-width:480px) {
      .wrap { width:min(100% - 24px,1040px); }
      .hero-art img { width:100%; }
      .card { min-height:230px; padding:25px; border-radius:22px; }
      .open { left:25px; bottom:24px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero" aria-label="쓰웽이네 소개">
      <div class="hero-copy">
        <p class="eyebrow">MY TOOLS</p>
        <h1>필요한 도구를<br><span class="accent">하나씩.</span></h1>
        <p class="intro">쓰웽이 직접 만든 간단하고 유용한 도구들을 모아두는 공간입니다.</p>
      </div>
      <div class="hero-art">
        <img src="sseweng-hero.webp" alt="노트북으로 AI 도구를 만드는 쓰웽이네 캐릭터">
      </div>
    </section>

    <section class="grid" aria-label="도구 목록">
      <a class="card" href="apartment-loan-calculator.html">
        <div class="icon" aria-hidden="true">🏠</div>
        <h2>아파트 대출 계산기</h2>
        <p>아파트 가격, 보유자금, LTV, DSR과 대출 조건을 입력해 상환액과 자금 계획을 계산합니다.</p>
        <span class="open">계산기 열기 →</span>
      </a>

      <a class="card game" href="animal-crossing-bag-helper.html">
        <div class="icon" aria-hidden="true">🎒</div>
        <h2>모동숲 가방 도우미</h2>
        <p>잡은 생물을 빠르게 검색하고 판매가를 비교해, 가방에 무엇을 남길지 쉽게 결정합니다.</p>
        <span class="open">도우미 열기 →</span>
      </a>
    </section>

    <footer><span>🐾</span> 새로운 도구는 앞으로 이곳에 하나씩 추가됩니다.</footer>
  </main>
</body>
</html>

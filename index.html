<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Tools</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", Arial, sans-serif;
      background: #f6f7f9;
      color: #17191c;
    }
    .wrap {
      width: min(920px, calc(100% - 36px));
      margin: 0 auto;
      padding: 72px 0;
    }
    .eyebrow {
      margin: 0 0 10px;
      color: #69707a;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(32px, 6vw, 52px);
      letter-spacing: -.04em;
    }
    .intro {
      margin: 14px 0 42px;
      color: #69707a;
      font-size: 17px;
      line-height: 1.7;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 18px;
    }
    .card {
      display: block;
      padding: 26px;
      min-height: 210px;
      border: 1px solid #e1e4e8;
      border-radius: 20px;
      background: #fff;
      color: inherit;
      text-decoration: none;
      transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
    }
    .card:hover {
      transform: translateY(-3px);
      border-color: #c9ced6;
      box-shadow: 0 12px 30px rgba(0,0,0,.06);
    }
    .icon {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      margin-bottom: 24px;
      border-radius: 14px;
      background: #f0f2f5;
      font-size: 24px;
    }
    .card h2 {
      margin: 0 0 9px;
      font-size: 21px;
      letter-spacing: -.02em;
    }
    .card p {
      margin: 0;
      color: #69707a;
      line-height: 1.6;
      font-size: 14px;
    }
    .open {
      display: inline-block;
      margin-top: 22px;
      font-size: 14px;
      font-weight: 700;
    }
    footer {
      margin-top: 50px;
      color: #9298a1;
      font-size: 12px;
    }
    @media (max-width: 520px) {
      .wrap { padding: 44px 0; }
      .intro { margin-bottom: 30px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <p class="eyebrow">MY TOOLS</p>
    <h1>필요한 도구를 하나씩.</h1>
    <p class="intro">쓰웽이 직접 만든 간단하고 유용한 도구들을 모아두는 공간입니다.</p>

    <section class="grid" aria-label="도구 목록">
      <a class="card" href="apartment-loan-calculator.html">
        <div class="icon" aria-hidden="true">🏠</div>
        <h2>아파트 대출 계산기</h2>
        <p>아파트 가격, 보유자금, LTV, DSR과 대출 조건을 입력해 상환액과 자금 계획을 계산합니다.</p>
        <span class="open">계산기 열기 →</span>
      </a>
    </section>

    <footer>새로운 도구는 앞으로 이곳에 하나씩 추가됩니다.</footer>
  </main>
</body>
</html>

<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>준케이의 SM5 탈출 대작전</title><style>*{box-sizing:border-box}body{margin:0;background:#10182d;color:#fff;font-family:system-ui,'Malgun Gothic',sans-serif;display:flex;justify-content:center;align-items:center;min-height:100dvh}main{width:min(100%,1000px);padding:10px}h1{margin:4px 0 8px;text-align:center;font-size:clamp(20px,4vw,32px);text-shadow:3px 3px #142d5d}.wrap{position:relative;border:5px solid #283e6c;box-shadow:0 8px 0 #070d20;border-radius:8px;overflow:hidden;background:#76b9ed}canvas{display:block;width:100%;aspect-ratio:16/9;image-rendering:pixelated;touch-action:none}.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;background:rgba(9,16,36,.84);gap:12px}.overlay.hidden{display:none}.overlay h2{font-size:clamp(24px,5vw,44px);margin:0;color:#ffda57;text-shadow:3px 4px #a6421b}.overlay p{margin:0;line-height:1.7;white-space:pre-line;font-weight:700}.overlay button,.controls button{background:#ffbd44;color:#17203c;border:3px solid #fff;border-radius:9px;font-weight:900;cursor:pointer;box-shadow:0 4px #98551e}.overlay button{padding:12px 30px;font-size:20px}.controls{display:flex;justify-content:space-between;gap:12px;margin-top:12px}.controls button{font-size:19px;padding:14px;flex:1;touch-action:manipulation}.hint{text-align:center;font-size:13px;color:#bac9e7;margin:10px 0}.badge{display:inline-block;background:#ff5c67;padding:3px 8px;border-radius:5px;font-size:12px}#letter{background:#fff;color:#20232c;padding:18px;border:4px double #424657;max-width:430px;width:95%;transform:rotate(-2deg);box-shadow:7px 8px #080b16;text-align:left;line-height:1.8}#letter b{color:#ba2837}#letter strong{display:block;text-align:center;font-size:22px;border-bottom:2px solid #555;padding-bottom:8px}#letter small{color:#555}@media(max-width:520px){.overlay{gap:7px;padding:9px}.overlay p{font-size:13px}.overlay button{padding:8px 20px;font-size:17px}#letter{padding:8px;font-size:12px;line-height:1.45}#letter strong{font-size:16px}.controls button{padding:12px}}</style></head><body><main><h1>🚗 준케이의 <span style="color:#ffce50">SM5</span> 탈출 대작전 <span class="badge">HELL ROAD</span></h1><div class="wrap"><canvas id="game" width="960" height="540" aria-label="차선을 바꿔 장애물을 피하는 게임"></canvas><div id="overlay" class="overlay"><h2 id="headline">산업시설진단처 탈출!</h2><p id="message">준케이가 은색 뉴 SM5에 탔다! 🚗💨<br>↑ ↓ 또는 W S로 3개 차선을 이동!<br>장애물을 피해서 35초간 버텨라!<br>한 번 충돌하면 바로 붙잡힌다 💀</p><div id="letter" style="display:none"><strong>📄 인사발령 통지서</strong><div>수신: 준케이</div><div>발령부서: <b>산업시설진단처</b></div><div>발령사유: 업무 연속성 확보</div><div>발령일자: 즉시</div><small>※ 본 발령은 본인 의사와 관계없이 적용됩니다.</small></div><button id="start">🚘 시동 걸고 탈출!</button></div></div><div class="controls"><button id="up">⬆ 윗차선</button><button id="down">⬇ 아랫차선</button></div><div class="hint">PC: ↑ / ↓ 또는 W / S · 모바일: 버튼 또는 화면 위아래 터치 · 다시 시작: Enter</div></main><script>
const canvas=document.getElementById('game'),c=canvas.getContext('2d');c.imageSmoothingEnabled=false;const overlay=document.getElementById('overlay'),headline=document.getElementById('headline'),message=document.getElementById('message'),letter=document.getElementById('letter'),start=document.getElementById('start');let state='menu',lane=1,carY=0,elapsed=0,spawn=0,obstacles=[],roadOffset=0,last=0,score=0,flash=0;const centers=[286,373,460],labels=['개포티팀장','전화안당겨받네','한국가스공사'],colors=['#fa6d5d','#ffdc5a','#68baff'];let seed=42;function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}function rect(x,y,w,h,color){c.fillStyle=color;c.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}function txt(t,x,y,size=20,color='#fff',align='left'){c.font=`900 ${size}px 'Malgun Gothic',system-ui,sans-serif`;c.textAlign=align;c.lineWidth=4;c.strokeStyle='#1b2848';c.strokeText(t,x,y);c.fillStyle=color;c.fillText(t,x,y)}function startGame(){state='play';lane=1;carY=centers[lane];elapsed=0;spawn=1.1;obstacles=[];roadOffset=0;score=0;flash=0;overlay.classList.add('hidden')}function show(title,body,win){state=win?'win':'lose';headline.textContent=title;message.textContent=body;letter.style.display=win?'block':'none';start.textContent=win?'🔁 또 탈출 시도하기':'🚗 다시 도망가기';overlay.classList.remove('hidden')}start.onclick=startGame;function move(d){if(state==='play')lane=Math.max(0,Math.min(2,lane+d))}document.getElementById('up').onclick=()=>move(-1);document.getElementById('down').onclick=()=>move(1);window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown',' ','Enter'].includes(e.key))e.preventDefault();if(e.repeat)return;if(e.key==='ArrowUp'||e.key.toLowerCase()==='w')move(-1);if(e.key==='ArrowDown'||e.key.toLowerCase()==='s')move(1);if(e.key==='Enter'&&state!=='play')startGame()});let sy=0;canvas.addEventListener('pointerdown',e=>{sy=e.clientY;const r=canvas.getBoundingClientRect();if(state==='play'){move((e.clientY-r.top)/r.height<.5?-1:1)}});
function building(x,y,w,h,col){rect(x,y,w,h,col);rect(x+6,y+8,w-12,7,'#466b98');for(let yy=y+23;yy<y+h-8;yy+=18)for(let xx=x+9;xx<x+w-10;xx+=18)rect(xx,yy,9,9,'#a9e0fa')}function background(){rect(0,0,960,232,'#79bff3');rect(0,0,960,55,'#4e9cde');for(let i=0;i<9;i++){let x=(i*149+25-roadOffset*.08%149+960)%1080-50;rect(x,70+(i%3)*21,68,14,'#e5f5ff');rect(x+15,58+(i%3)*21,38,13,'#e5f5ff')}for(let i=0;i<15;i++){let x=(i*83-roadOffset*.17%83+960)%1100-60;building(x,152-(i%4)*24,72,105+(i%4)*24,i%2?'#809fc0':'#9ab4ce')}building(704,83,205,151,'#c8d5df');rect(721,99,169,34,'#edf3fa');txt('산업시설진단처',805,124,22,'#155397','center');rect(0,224,960,12,'#496e7c');for(let i=0;i<15;i++){let x=(i*78-roadOffset*.5%78+960)%1080-50;rect(x,207,13,28,'#36865c');rect(x-10,196,33,23,'#4baf6c')}rect(0,236,960,304,'#485469');rect(0,240,960,8,'#9faab7');for(let j=0;j<2;j++)for(let i=0;i<11;i++){let x=(i*115-roadOffset%115+115)%1265-110;rect(x,326+j*87,69,5,'#d8e3e8')}rect(0,524,960,16,'#28354a');for(let i=0;i<20;i++)rect((i*67-roadOffset%67+67)%1060-50,528,37,4,'#f4cf75')}
function car(x,y){c.save();c.translate(Math.round(x),Math.round(y));rect(-59,17,117,15,'#24334d');rect(-49,-11,90,34,'#e7ecf5');rect(-30,-26,49,18,'#e9eef8');rect(-25,-23,20,14,'#80b6d9');rect(-2,-23,18,14,'#80b6d9');rect(-17,-21,12,12,'#f5c6a4');rect(-16,-24,12,5,'#49372c');rect(-16,-17,3,3,'#25253a');rect(-51,-7,10,13,'#f5f7fc');rect(38,-6,13,13,'#fff3c3');rect(45,-1,13,8,'#ffdf9a');rect(-44,19,22,22,'#1b2336');rect(-40,23,14,14,'#a7b1c0');rect(23,19,22,22,'#1b2336');rect(27,23,14,14,'#a7b1c0');rect(-36,2,67,3,'#9aa7b9');rect(7,-6,2,25,'#b0bcc9');rect(49,10,7,5,'#e7d9b3');rect(-51,9,11,6,'#df6c66');txt('SM5',1,15,12,'#23374c','center');c.restore()}
function obstacle(o){
 let y=centers[o.lane], x=o.x;
 const themes=[['#fff0d0','#e5a229','#8b2600','⚠ 위험 인물'],['#e1f1ff','#3679c7','#174e96','☎ 긴급 전화'],['#ffe6e6','#d44c4c','#a32323','! 긴급 진단']];
 const [bg,edge,sub,tag]=themes[o.type];
 // 큰 표지판은 읽기 편하도록 만들되 충돌 판정은 기존 그대로 유지한다.
 rect(x-91,y-39,182,76,'#15243d');rect(x-87,y-35,174,68,edge);rect(x-82,y-30,164,58,bg);
 c.textAlign='center';c.textBaseline='middle';
 c.font="900 13px 'Malgun Gothic',system-ui,sans-serif";c.fillStyle=sub;c.fillText(tag,x,y-18);
 c.font="900 22px 'Malgun Gothic',system-ui,sans-serif";c.fillStyle='#101827';c.fillText(labels[o.type],x,y+9);
 c.textBaseline='alphabetic';
 rect(x-72,y+37,12,7,'#263449');rect(x+60,y+37,12,7,'#263449');
}
function frame(t){let dt=Math.min((t-last)/1000||0,.05);last=t;if(state==='play'){elapsed+=dt;let speed=300+elapsed*10+(elapsed>24?80:0);roadOffset+=speed*dt;carY+=(centers[lane]-carY)*Math.min(1,dt*16);spawn-=dt;if(spawn<=0){let l=Math.floor(rnd()*3),type=Math.floor(rnd()*3);obstacles.push({x:1150,lane:l,type});let interval=Math.max(.53,1.08-elapsed*.012);spawn=interval*(.88+rnd()*.3);if(elapsed>14&&rnd()<.27){let l2=(l+1+Math.floor(rnd()*2))%3;obstacles.push({x:1150,lane:l2,type:Math.floor(rnd()*3)})}}for(let o of obstacles){o.x-=speed*dt;if(Math.abs(o.x-187)<91&&Math.abs(centers[o.lane]-carY)<49){flash=1;show('💀 탈출 실패!','준케이의 SM5가 업무에 붙잡혔다!\n"준케이 씨, 어디 가세요?"\n산업시설진단처로 강제 복귀...',false);break}}obstacles=obstacles.filter(o=>o.x>-200);score=Math.floor(elapsed*100);if(elapsed>=35)show('🎉 탈출 성공!!!','준케이는 마침내 산업시설진단처를 벗어났다!\n그런데 다음 날... 인사팀에서 문자가 왔다.\n💀 "나간 적이 없는데요?"',true)}background();obstacles.forEach(obstacle);car(187,carY||centers[1]);rect(15,12,233,62,'#142642');txt('⏱ '+Math.max(0,Math.ceil(35-elapsed))+'초',28,40,23,'#ffe06a');txt('점수 '+score,28,64,16,'#fff');rect(723,12,220,62,'#142642');txt('탈출 진행도',735,36,17,'#fff');rect(735,46,192,13,'#27364e');rect(735,46,192*Math.min(1,elapsed/35),13,'#ffc247');if(state==='play'&&elapsed>24)txt('⚠ 업무 폭탄 구간!',480,56,23,'#ffe56c','center');requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
